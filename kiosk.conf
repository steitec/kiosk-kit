# kiosk-kit configuration. Copy, edit, then: sudo ./install.sh --config kiosk.conf
# The installer copies this file to /etc/kiosk-kit/kiosk.conf, where the browser
# launcher and the display service read it at runtime.

# Page to show. The launcher waits until its host:port answers before starting.
KIOSK_URL="http://192.168.1.10:8080/"

# Local account that logs in automatically and runs the browser (created if missing).
KIOSK_USER="kiosk"

# Browser UI language (Chromium follows LANGUAGE on Linux, --lang has no effect).
KIOSK_LANG="en"

# Seconds to wait for KIOSK_URL to answer after boot before starting anyway.
WAIT_TIMEOUT=120

# Delete the browser's disk cache before every start, so updated pages show up
# even when the server sends long cache lifetimes. yes | no
CLEAR_CACHE="yes"

# Switch the display off after this many seconds without input; a touch wakes it
# and is swallowed, so it does not click whatever is under the finger. 0 = never.
DISPLAY_IDLE=300

# Touchscreen to watch, as a substring of its name (see /proc/bus/input/devices).
# Empty: any device udev marks as a touchscreen.
TOUCH_NAME=""

# Optional touch calibration for libinput (works on Wayland and X11):
# USB id vendor:product and the first two rows of the calibration matrix.
TOUCH_USB_ID=""
TOUCH_CALIBRATION=""
# Example (PenMount panel):
# TOUCH_USB_ID="14e1:6000"
# TOUCH_CALIBRATION="1.2492 0.0 -0.1207 0.0 1.1355 -0.0665"

# Automatic security updates, reboot only when required, at this time. yes | no
UPDATES="yes"
REBOOT_TIME="04:00"
